<header class="app-header">
    <h1>Tasks Management Application</h1>
</header>

<main class="container">
    <!-- Controls -->
    <div class="controls">
        <input type="text" placeholder="Search by title" class="search-field">

        <select class="filter-select" id="status-filter">
            <option value="">All Status</option>
            <option value="To Do">To Do</option>
            <option value="In Progress">In Progress</option>
            <option value="Done">Done</option>
        </select>

        <select class="filter-select" id="priority-filter">
            <option value="">All Priorities</option>
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
        </select>

        <button class="btn-add" (click)="addTask()">Add Task</button>
    </div>

    <!-- Task Table -->
    <div class="task-table">
        <table>
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Title</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
  <tr *ngFor="let item of taskList; let i = index">
    <td>{{i + 1}}</td>
    <td>
      {{item.title}}
      <div class="task-tags">
        <span class="status" [ngClass]="item.status.toLowerCase().replace(' ', '-')">{{item.status}}</span>
        <span class="priority" [ngClass]="item.priority.toLowerCase()">{{item.priority}}</span>
      </div>
    </td>
    <td class="actions">
      <button class="btn-view" (click)="onView(item)">View</button>
      <button class="btn-edit" (click)="onEdit(item)">Edit</button>
      <button class="btn-delete" (click)="onDelete(item.Id)">Delete</button>
    </td>
  </tr>
</tbody>
        </table>
    </div>
</main>
